# Written by `pubrules sync` from the ci block of pubrules.json. Do not edit:
# change pubrules.json and run `pubrules sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-tested.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  checks:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-service-checks.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    with: {"shellcheck": "bin/data"}

  terraform:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-service-terraform.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    with: {"terraform-dir": "infra"}

  tests:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-service-tests.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    with: {"setup": "make venv", "test": "make functional"}

  lint:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-python-lint.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    with: {"setup": "make venv", "lint": "make lint"}

  sonar:
    name: ci
    needs: [tested, tests]
    if: ${{ github.event_name != 'merge_group' && needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-sonar.yml@542935feec5b50793030c4a83bcbb2b1ec5941cc # v0.49.0
    permissions:
      contents: read
      pull-requests: read
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it, or is the scan, which the merge
  # queue never runs. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, checks, terraform, tests, lint, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" --arg event "$EVENT" '.tested.result == "success"
            and all(to_entries[]; .value.result == "success" or (.value.result == "skipped"
              and ($tested == "true" or (.key == "sonar" and $event == "merge_group"))))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}', EVENT: '${{ github.event_name }}' }
