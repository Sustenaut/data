# Builds the ingest image from main, checks that it starts, pushes it, and
# points the soldera-ingest job at it. It runs as soldera-deploy (infra/),
# which can do that and nothing else. Nothing runs until the repository
# variable DEPLOY_CI is on, which waits for the first terraform apply.
name: deploy

on:
  push:
    branches: [main]
    paths: [src/**, pipelines/**, corrections/**, Dockerfile, .dockerignore, requirements.lock, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build every layer again, with the current base packages
        type: boolean
        default: false

permissions: { contents: read, id-token: write }

concurrency: { group: deploy-soldera-ingest, cancel-in-progress: false }

env:
  REGION: europe-north1
  IMAGE: europe-north1-docker.pkg.dev/sustenaut/soldera/ingest
  JOB: soldera-ingest

jobs:
  deploy:
    if: vars.DEPLOY_CI == 'on' && github.ref == 'refs/heads/main'
    runs-on: sustenaut-ci
    environment: deploy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: Sustenaut/pubhost/actions/docker-build@cd88da2277ef8772744e14c38df24b350ee2cacb # v0.2.0
        with:
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          scope: soldera-ingest
          build-args: SOLDERA_COMMIT=${{ github.sha }}
          no-cache: ${{ inputs.no-cache || false }}

      - name: The image starts and reads its pipeline
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" --version
          docker run --rm "$IMAGE:$GITHUB_SHA" corrections check corrections/eex-french-power-auctions.yaml

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the image and deploy it to the job
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          gcloud run jobs update "$JOB" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" --quiet
          echo "Deployed \`$IMAGE:$GITHUB_SHA\` to the Cloud Run job \`$JOB\`." >> "$GITHUB_STEP_SUMMARY"
