# Builds the ingest image from main, checks that it starts, pushes it, and
# points the soldera-ingest job at it. It runs as soldera-deploy (infra/),
# which can do that and nothing else. Google admits main's runs of the
# repositories in shared-infra's github_repositories through the pool's github
# provider, so this runs from main only. Nothing runs until the repository
# variable DEPLOY_CI is on, which waits for the first terraform apply. Then
# it runs the job from the first stage whose parser changed, if any.
name: deploy ingest pipeline

on:
  push:
    branches: [main]
    paths: [src/ingest/**, pipelines/**, corrections/**, Dockerfile, .dockerignore, requirements.lock, .github/workflows/deploy-ingest.yml]
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build every layer again, with the current base packages
        type: boolean
        default: false

permissions: { contents: read, id-token: write }

concurrency: { group: deploy-soldera-ingest, cancel-in-progress: false }

env:
  REGION: europe-north1
  IMAGE: europe-north1-docker.pkg.dev/sustenaut/soldera/ingest
  JOB: soldera-ingest
  PIPELINE: pipelines/eex-french-go-auctions.yaml

jobs:
  deploy:
    if: vars.DEPLOY_CI == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: Sustenaut/pubhost/actions/docker-build@cd88da2277ef8772744e14c38df24b350ee2cacb # v0.2.0
        with:
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          scope: soldera-ingest
          build-args: DATA_COMMIT=${{ github.sha }}
          no-cache: ${{ inputs.no-cache || false }}

      - name: The image starts and reads its pipeline
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" --version
          docker run --rm "$IMAGE:$GITHUB_SHA" corrections check corrections/eex-french-go-auctions.yaml

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/948171295184/locations/global/workloadIdentityPools/github/providers/github
          service_account: soldera-deploy@sustenaut.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the image and deploy it to the job
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          gcloud run jobs update "$JOB" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" --quiet
          echo "Deployed \`$IMAGE:$GITHUB_SHA\` to the Cloud Run job \`$JOB\`." >> "$GITHUB_STEP_SUMMARY"

      # --from auto runs from the first stage whose pin has no stored run (or
      # that read older input), and does nothing at all when every stage is current.
      - name: Rebuild the stages whose parser changed
        run: |
          echo "data run $PIPELINE --from auto --trigger deploy" >> "$GITHUB_STEP_SUMMARY"
          gcloud run jobs execute "$JOB" --region "$REGION" --wait \
            --args="run,$PIPELINE,--from,auto,--trigger,deploy" \
            --update-env-vars="GITHUB_REPOSITORY=$GITHUB_REPOSITORY,GITHUB_RUN_ID=$GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW=$GITHUB_WORKFLOW,GITHUB_SHA=$GITHUB_SHA,GITHUB_ACTOR=$GITHUB_ACTOR"
