[project]
name = "soldera"
version = "0.1.0"
description = "Ingest pipelines for data.sustenaut.eu: staged, versioned, re-runnable from any stage"
requires-python = ">=3.12"
dependencies = [
  "pyarrow>=22",
  "pyyaml>=6",
  "openpyxl>=3.1",
]

[project.scripts]
soldera = "soldera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soldera"]

[tool.coverage.run]
source = ["soldera"]
patch = ["subprocess"]
parallel = true
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.xml]
output = "coverage/coverage.xml"
