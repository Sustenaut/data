[project]
name = "sustenaut-data"
version = "0.1.0"
description = "Ingest pipelines for data.sustenaut.eu: staged, versioned, re-runnable from any stage"
requires-python = ">=3.12"
dependencies = [
  "pyarrow>=22",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "duckdb>=1.4",
  "google-auth>=2.40",
]

[project.optional-dependencies]
# The go-auctions app (src/app): its image installs these too.
app = [
  "streamlit>=1.67",
  "plotly>=7.1",
]

[project.scripts]
data = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/app"]

[tool.coverage.run]
source = ["ingest", "app"]
patch = ["subprocess"]
parallel = true
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.xml]
output = "coverage/coverage.xml"
