[project]
name = "sustenaut-data"
version = "0.1.0"
description = "Ingest pipelines for data.sustenaut.eu: staged, versioned, re-runnable from any stage"
requires-python = ">=3.12"
dependencies = [
  "pyarrow>=22",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "duckdb>=1.4",
  "google-auth>=2.40",
]

[project.optional-dependencies]
# The go-auctions app (src/app): its image installs these too.
app = [
  "streamlit>=1.67",
  "plotly>=7.1",
]

[project.scripts]
data = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/app"]

# Ruff: pubrules' Python standard (pubrules-ruff.toml, managed), which
# `make lint` and CI's lint job check.
[tool.ruff]
extend = "pubrules-ruff.toml"

[tool.ruff.lint.per-file-ignores]
# pytest-bdd steps take their fixtures as arguments, by name.
"tests/steps/*" = ["PLR0913"]

# mypy, which `make lint` runs. It checks the ingest runner's core first;
# the parsers and the app follow once it passes there.
[tool.mypy]
files = ["src/ingest/core"]
mypy_path = "src"
python_version = "3.12"
strict = true

# google-auth's functions carry no annotations, and pyarrow ships no types.
untyped_calls_exclude = ["google"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ingest", "app"]
patch = ["subprocess"]
parallel = true
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.xml]
output = "coverage/coverage.xml"
