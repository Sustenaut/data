# The French auctions of power guarantees of origin, from EEX, into one
# DuckDB for data.sustenaut.eu/go-auctions. Each stage pins its parser:
# bumping a version here is how a stage is changed, and `data run
# --from auto` re-runs from the first stage whose pin changed.
pipeline: eex-french-go-auctions
plugins: [ingest.parsers.eex, ingest.parsers.auction_results]
stages:
  - name: discover
    parser: eex-french-auction-page@1.0.0
    options:
      url: "${EEX_URL:-https://www.eex.com}/en/markets/energy-certificates/french-auctions-power"
  - name: download
    parser: eex-french-auction-download@1.0.0
    options:
      site: "${EEX_URL:-https://www.eex.com}"
  - name: select
    parser: eex-go-global-results-select@1.0.0
  - name: parse
    parser: eex-french-auction@1.0.0
    options:
      # Mistakes found in EEX's files, and what is done about each.
      corrections: corrections/eex-french-go-auctions.yaml
  - name: database
    parser: auction-results-duckdb@1.1.0
    options:
      # The file the app at data.sustenaut.eu/go-auctions reads.
      database: go-auctions.duckdb
